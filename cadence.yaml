# Livraison par `cadence deliver` (https://github.com/Sylad/cadence).
# Cloudflare Pages (intégration Git) construit et publie lui-même à chaque push sur main :
# pas de CI GitHub, rien à lancer pour déployer. La livraison se prouve par la page
# d'accueil qui porte le sha court du commit poussé (<meta name="version">, posé au build
# depuis CF_PAGES_COMMIT_SHA — frontend/src/lib/build-version.ts).
deliver:
  ci: none
  deploy: []
  verify:
    - url: https://evatosorus.pages.dev/
      contains: '<meta name="version" content="${SHORT}">'
  verifyTimeout: 1200

# Revue UX automatique des vagues (cadence orchestrate) : le programme lance l'app depuis la racine,
# sonde l'URL puis tue le groupe. Node 22 (.nvmrc) : le Node par défaut de la machine est trop ancien pour Astro 6.
orchestrate:
  # Escalade (L38, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  ux:
    command: 'cd frontend && npx astro dev --port 4312 --host 127.0.0.1'
    url: http://127.0.0.1:4312
    timeout: 300
  # Porte de tests de la vague (L36) : lancée par le programme après chaque étape d'écriture, depuis la racine.
  # Commandes vérifiées vertes sur main le 2026-10-25 : test:scripts = 129 tests node --test des scripts (~200 s),
  # astro build = 1532 pages en ~15 s. Le site n'a pas d'autre suite (pas de test de composants).
  # 14 fichiers de test lisent frontend/dist (les 12 *.e2e.test.mjs, plus species-decimals et title-fit ;
  # species-decimals s'ignore seul sans dist) — dist est ignoré par git, absent d'un worktree neuf.
  # L37 (25-10) : cadence joue maintenant `build` AVANT `test`, ligne de base comprise (cadence L333) — le build
  # n'est plus répété ici ; les tests qui lisent frontend/dist le trouvent construit par la porte `build`.
  test: 'cd frontend && npm run test:scripts'
  build: 'cd frontend && npx astro build'
  # precheck: true = le contrôle préalable cherche si le lot est déjà livré, sur Sonnet.
  precheck: true

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # Site Astro statique : pages/composants/data (hors `data/generated`, hors CSS, hors tests) décrits par l'arbre du README, le CLAUDE.md (sections livrées) et HOW-IT-WORKS (landing, carte, filtres) ; une Nouveauté vaut pour un changement visible.
    - paths: ['frontend/src/**', 'frontend/astro.config.mjs', '!frontend/src/data/generated/**', '!**/*.css', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, HOW-IT-WORKS.md, 'docs/nouveautes/*.md']
    # Pipeline de données (import PaleoBioDB, enrichissement Wikidata/Ollama, optimisation MP4) : sections « Enrichir… » du README, « Le pipeline data » de HOW-IT-WORKS, DEPLOY.
    - paths: ['scripts/**', '!scripts/lib/e2e-dist.mjs', '!**/*.test.*', '!**/*.spec.*']
      docs: [README.md, HOW-IT-WORKS.md, DEPLOY.md]
  since: 2026-10-24
  articles:
    - repo: ../claude-code-codex
      file: frontend/src/pages/case-studies/evatosorus.astro
